name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The scanner targets 3.9+; the ends of that range are what break.
        python-version: ["3.9", "3.11", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Confirm the scanner runs with no dependencies installed
        run: |
          python -m quantumready --help
          python -m quantumready mosca --shelf-life 25 --migration-years 5
          python -m quantumready algorithms > /dev/null

      - name: Install test dependencies
        run: pip install -e ".[dev]"

      - name: Run tests
        run: python -m pytest -q

  self-scan:
    # Proves the pipeline gate works end to end against a real target.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Scan a known-good host
        run: |
          python -m quantumready scan github.com \
            --max-hosts 2 --fast --no-ct \
            --html-out report.html --json-out result.json --cbom-out crypto.json
          python -c "import json; d=json.load(open('result.json')); print(d['summary'])"
      - uses: actions/upload-artifact@v4
        with:
          name: scan-report
          path: |
            report.html
            result.json
            crypto.json
